plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sleepsheeps.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sleepsheeps.app'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs straight away.
            // Replace with your own signing config before publishing to Google Play.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
