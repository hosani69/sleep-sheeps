<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sleep Sheeps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#070b1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  @font-face { font-family: "Fredoka"; src: url("Fredoka.ttf") format("truetype"); font-weight: 300 700; font-display: block; }
  /* Layout: one full-bleed night-sky canvas; a single exit control pinned top-left. Single dark look by design. */
  :root {
    --night: #070b1f;
    --night-2: #142046;
    --moon: #fff4d2;
    --ink: #2f3768;
    --wool: #eef0f8;
    --glass: rgba(255, 255, 255, 0.10);
    --glass-edge: rgba(255, 255, 255, 0.22);
    --font-round: "Fredoka", ui-rounded, "Nunito", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--night);
    color: var(--wool);
    overflow: hidden;
    font-family: var(--font-round);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #sky, #sky3d { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #sky[hidden], #sky3d[hidden] { display: none; }
  .toast {
    position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16px); transform: translateX(-50%);
    z-index: 6; padding: 8px 16px; border-radius: 999px;
    background: rgba(7, 11, 31, 0.7); color: var(--moon);
    font: 500 15px/1.2 var(--font-round); white-space: nowrap;
    opacity: 0; transition: opacity .3s ease; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .exit {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    left: calc(env(safe-area-inset-left, 0px) + 14px);
    z-index: 5;
    display: inline-flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; padding: 0;
    border-radius: 999px;
    border: 1px solid var(--glass-edge);
    background: var(--glass);
    color: var(--wool);
    font: 500 15px/1 var(--font-round);
    letter-spacing: 0.02em;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background .2s, transform .15s;
  }
  .exit:hover { background: rgba(255,255,255,0.18); }
  .exit:active { transform: scale(0.96); }
  .exit:focus-visible { outline: 2px solid var(--moon); outline-offset: 3px; }
  .exit svg { width: 20px; height: 20px; }

  .style-switch {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 14px);
    right: calc(env(safe-area-inset-right, 0px) + 14px);
    z-index: 5;
    display: inline-flex; padding: 3px; gap: 2px;
    border-radius: 999px;
    border: 1px solid var(--glass-edge);
    background: var(--glass);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .style-switch button {
    min-width: 44px; height: 36px; padding: 0 12px;
    border: 0; border-radius: 999px; cursor: pointer;
    background: transparent; color: var(--wool); opacity: .7;
    font: 600 15px/1 var(--font-round); letter-spacing: 0.04em;
  }
  .style-switch button[aria-pressed="true"] { background: var(--moon); color: var(--ink); opacity: 1; }
  .style-switch button:focus-visible { outline: 2px solid var(--moon); outline-offset: 2px; }

  .rotate {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    z-index: 4;
    padding: 8px 14px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--glass-edge);
    color: var(--wool); font: 500 14px/1.2 var(--font-round);
    white-space: nowrap;
  }
  @media (orientation: landscape) { .rotate { display: none; } }

  .goodnight {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(ellipse at 50% 40%, #0d1433 0%, #02030a 75%);
    color: var(--wool); text-align: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    opacity: 0; transition: opacity .8s ease;
  }
  .goodnight[hidden] { display: none; }
  html, body { margin: 0; }
  .goodnight.show { opacity: 1; }
  .goodnight h1 { margin: 0; font: 600 clamp(28px, 6vw, 54px)/1.1 var(--font-round); color: var(--moon); text-shadow: 0 0 24px rgba(255, 236, 170, .45); }
  .goodnight p { margin: 0; font: 500 16px/1.4 var(--font-round); opacity: .7; max-width: 36ch; }
  .goodnight button {
    margin-top: 6px; padding: 10px 18px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--glass-edge); background: var(--glass); color: var(--wool);
    font: 500 15px/1 var(--font-round);
  }
  .goodnight button:focus-visible { outline: 2px solid var(--moon); outline-offset: 3px; }
</style>

</head><body>
<canvas id="sky" aria-label="Sheep jumping over a fence under a starry sky. The moon shows how many have jumped. Double-tap the moon to reset the count."></canvas>

<button class="exit" id="exit" type="button" aria-label="Exit app">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>

<div class="style-switch" role="group" aria-label="Art style">
  <button type="button" id="mode-2d" aria-pressed="false">2D</button>
  <button type="button" id="mode-3d" aria-pressed="true">3D</button>
</div>

<div class="toast" id="toast" role="status">Counter reset</div>

<div class="rotate" id="rotate">Turn your phone sideways for the full meadow</div>

<div class="goodnight" id="goodnight" hidden>
  <h1>Good night</h1>
  <p id="gn-count">The sheep are resting.</p>
  <button type="button" id="wake">Back to the sheep</button>
</div>

<script src="three.min.js"></script>
<script>
(() => {
  const cv = document.getElementById('sky');
  const ctx = cv.getContext('2d');
  const MAX_COUNT = 999;
  const N_SHEEP = 10;
  const JUMP_INTERVAL = 2.0;   // seconds between jumps at the fence
  const LAP_TIME = 12;         // seconds to walk one lap with no waiting

  let W = 0, H = 0, dpr = 1, u = 40;
  let gy, by, fx, fenceH, jumpH;
  let pts = [], cum = [], L = 1, Sj = 0, Jl = 0;
  let stars = [], shooters = [];
  let count = 0, moonPop = 0, lastJump = -99, clock = 0;
  let celebrate = 0, resetFlash = 0;
  let is3D = true;
  try { if (localStorage.getItem('sleepsheeps.style') === '2d') is3D = false; } catch (e) {}

  try { const c = parseInt(localStorage.getItem('sleepsheeps.count'), 10); if (c >= 0 && c <= MAX_COUNT) count = c; } catch (e) {}
  const saveCount = () => { try { localStorage.setItem('sleepsheeps.count', String(count)); } catch (e) {} };

  const POSES = ['star', 'superman', 'spin', 'backflip', 'wave', 'tuck', 'twirl', 'kick'];
  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  // ---------- the lap path: front lane L→R, turn up the hill, back lane R→L, turn down ----------
  function buildPath() {
    gy = H * 0.84;
    by = H * 0.665;
    fx = W * 0.5;
    const r = (gy - by) / 2;
    const cy = (gy + by) / 2;
    const x0 = Math.max(W * 0.03, 0) + r * 1.2;
    const xR = W - x0;
    pts = [];
    const add = (x, y) => pts.push([x, y]);
    const steps = 60;
    for (let i = 0; i <= steps; i++) add(lerp(x0, xR, i / steps), gy);
    for (let i = 1; i <= 24; i++) { const a = Math.PI / 2 - Math.PI * i / 24; add(xR + Math.cos(a) * r * 1.2, cy + Math.sin(a) * r); }
    for (let i = 1; i <= steps; i++) add(lerp(xR, x0, i / steps), by);
    for (let i = 1; i < 24; i++) { const a = -Math.PI / 2 - Math.PI * i / 24; add(x0 + Math.cos(a) * r * 1.2, cy + Math.sin(a) * r); }
    cum = [0];
    for (let i = 1; i <= pts.length; i++) {
      const p = pts[i - 1], q = pts[i % pts.length];
      cum.push(cum[i - 1] + Math.hypot(q[0] - p[0], q[1] - p[1]));
    }
    L = cum[cum.length - 1];
    const jw = u * 1.45;
    Sj = (fx - jw - x0) / L;
    Jl = (2 * jw) / L;
    fenceH = u * 1.05;
    jumpH = fenceH + u * 1.25;
  }

  function posAt(f) {
    let s = ((f % 1) + 1) % 1 * L;
    let lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= s) lo = m; else hi = m; }
    const p = pts[lo], q = pts[(lo + 1) % pts.length];
    const seg = cum[lo + 1] - cum[lo] || 1;
    const t = (s - cum[lo]) / seg;
    return { x: lerp(p[0], q[0], t), y: lerp(p[1], q[1], t), dx: q[0] - p[0] };
  }

  // ---------- stars ----------
  function buildStars() {
    stars = [];
    const n = Math.round((W * H) / 2600);
    for (let i = 0; i < n; i++) {
      const y = Math.pow(Math.random(), 1.4) * H * 0.78;
      stars.push({
        x: Math.random() * W, y,
        r: Math.random() < 0.06 ? rand(1.4, 2.2) : rand(0.35, 1.2),
        a: rand(0.35, 1), sp: rand(0.6, 2.4), ph: rand(0, Math.PI * 2),
        hue: Math.random() < 0.2 ? 'rgba(200,215,255,' : Math.random() < 0.15 ? 'rgba(255,230,200,' : 'rgba(255,255,255,'
      });
    }
  }

  function spawnShooter(big) {
    shooters.push({
      x: rand(W * 0.1, W * 0.9), y: rand(H * 0.03, H * 0.3),
      vx: rand(-1, 1) < 0 ? -rand(380, 620) : rand(380, 620), vy: rand(120, 220),
      life: 0, max: rand(0.7, 1.2), len: big ? rand(120, 200) : rand(70, 130)
    });
  }

  // ---------- sheep ----------
  const sheep = [];
  function placeSheep() {
    const gap = (u * 1.55) / L;
    sheep.length = 0;
    for (let i = 0; i < N_SHEEP; i++) {
      sheep.push({
        s: Sj - 0.0005 - i * gap, legPh: rand(0, 6), pose: null, counted: false,
        bob: rand(0, 6), wool: i % 4 === 3 ? '#f3e9dc' : '#eef0f8'
      });
    }
  }

  function step(dt) {
    clock += dt;
    const gap = (u * 1.55) / L;
    const v = 1 / LAP_TIME;
    // order: sheep[i-1] is ahead of sheep[i]
    const prevS = sheep.map(s => s.s);
    for (let i = 0; i < sheep.length; i++) {
      const me = sheep[i];
      const ahead = prevS[(i - 1 + sheep.length) % sheep.length];
      let d = ((ahead - me.s) % 1 + 1) % 1;
      if (sheep.length === 1) d = 1;
      let ds = Math.min(v * dt, Math.max(0, d - gap));
      let s = ((me.s % 1) + 1) % 1;
      // the gate at the fence: one jumper at a time
      if (s < Sj && s + ds >= Sj) {
        if (clock - lastJump >= JUMP_INTERVAL) {
          lastJump = clock;
          me.pose = POSES[Math.floor(Math.random() * POSES.length)];
          me.counted = false;
        } else {
          ds = Math.max(0, Sj - 0.0001 - s);
        }
      }
      s += ds;
      if (s >= 1) s -= 1;
      me.moving = ds > 1e-7;
      if (me.moving) me.legPh += dt * 11;
      me.s = s;
      // count when the sheep is over the top of the fence
      if (me.pose && !me.counted && s >= Sj + Jl * 0.5 && s < Sj + Jl) {
        me.counted = true;
        bump();
      }
      if (me.pose && s >= Sj + Jl) me.pose = null;
    }
  }

  function bump() {
    count = count >= MAX_COUNT ? 1 : count + 1;
    moonPop = 1;
    if (count === MAX_COUNT) { celebrate = 3; for (let i = 0; i < 6; i++) setTimeout(() => spawnShooter(true), i * 260); }
    saveCount();
  }

  // ---------- drawing ----------
  // Two art styles: 3D (lit, shaded volumes) and 2D (flat colours, no gradients).
  const moonGeom = { cx: 0, cy: 0, R: 1 };
  const LIGHT = { x: -0.45, y: -0.6 }; // light direction for 3D shading, from the moon above

  function drawSky(t) {
    if (is3D) {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#04071a');
      g.addColorStop(0.55, '#0d1638');
      g.addColorStop(1, '#1b2a57');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      ctx.save();
      ctx.translate(W * 0.5, H * 0.35);
      ctx.rotate(-0.35);
      const mg = ctx.createLinearGradient(0, -H * 0.18, 0, H * 0.18);
      mg.addColorStop(0, 'rgba(150,160,255,0)');
      mg.addColorStop(0.5, 'rgba(150,170,255,0.08)');
      mg.addColorStop(1, 'rgba(150,160,255,0)');
      ctx.fillStyle = mg;
      ctx.fillRect(-W, -H * 0.18, W * 2, H * 0.36);
      ctx.restore();
    } else {
      // flat bands of night
      const bands = ['#070b22', '#0b1230', '#101a3e', '#16224d'];
      bands.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, H * i / bands.length * 0.8, W, H); });
    }

    for (const s of stars) {
      const tw = 0.55 + 0.45 * Math.sin(t * s.sp + s.ph);
      if (is3D) {
        // depth: far stars are small and dim, near stars drift a touch and glow
        const a = s.a * tw;
        const x = (s.x + t * s.r * 0.6) % W;
        if (s.r > 1.1) {
          const gl = ctx.createRadialGradient(x, s.y, 0, x, s.y, s.r * 4);
          gl.addColorStop(0, s.hue + (a * 0.5).toFixed(3) + ')');
          gl.addColorStop(1, s.hue + '0)');
          ctx.fillStyle = gl;
          ctx.beginPath(); ctx.arc(x, s.y, s.r * 4, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = s.hue + a.toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
        if (s.r > 1.35) {
          ctx.strokeStyle = s.hue + (a * 0.55).toFixed(3) + ')';
          ctx.lineWidth = 0.8;
          const k = s.r * 3.2 * tw;
          ctx.beginPath();
          ctx.moveTo(x - k, s.y); ctx.lineTo(x + k, s.y);
          ctx.moveTo(x, s.y - k); ctx.lineTo(x, s.y + k);
          ctx.stroke();
        }
      } else {
        // flat: crisp dots, and the big ones are little 4-point star shapes
        ctx.fillStyle = s.hue + (tw > 0.35 ? s.a : s.a * 0.5).toFixed(3) + ')';
        if (s.r > 1.35) {
          const k = s.r * 2.6;
          ctx.beginPath();
          ctx.moveTo(s.x, s.y - k); ctx.lineTo(s.x + k * 0.3, s.y - k * 0.3); ctx.lineTo(s.x + k, s.y);
          ctx.lineTo(s.x + k * 0.3, s.y + k * 0.3); ctx.lineTo(s.x, s.y + k); ctx.lineTo(s.x - k * 0.3, s.y + k * 0.3);
          ctx.lineTo(s.x - k, s.y); ctx.lineTo(s.x - k * 0.3, s.y - k * 0.3); ctx.closePath(); ctx.fill();
        } else {
          const r = Math.max(0.8, s.r);
          ctx.fillRect(s.x - r, s.y - r, r * 2, r * 2);
        }
      }
    }
  }

  function drawShooters(dt) {
    for (let i = shooters.length - 1; i >= 0; i--) {
      const s = shooters[i];
      s.life += dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      const k = s.life / s.max;
      if (k >= 1) { shooters.splice(i, 1); continue; }
      const a = Math.sin(Math.PI * k);
      const sp = Math.hypot(s.vx, s.vy);
      const tx = s.x - s.vx / sp * s.len, ty = s.y - s.vy / sp * s.len;
      ctx.lineCap = 'round';
      if (is3D) {
        const g = ctx.createLinearGradient(s.x, s.y, tx, ty);
        g.addColorStop(0, `rgba(255,255,255,${a})`);
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.strokeStyle = g;
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();
      } else {
        ctx.strokeStyle = `rgba(255,244,210,${a})`;
        ctx.lineWidth = 2.5;
        ctx.setLineDash([s.len * 0.18, s.len * 0.12]);
        ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx, ty); ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }

  function drawMoon(t, dt) {
    const R = Math.min(H * 0.19, W * 0.13);
    const cx = W * 0.5, cy = Math.max(R + H * 0.06, H * 0.29);
    moonGeom.cx = cx; moonGeom.cy = cy; moonGeom.R = R;
    moonPop = Math.max(0, moonPop - dt * 2.2);
    resetFlash = Math.max(0, resetFlash - dt * 1.2);
    const pop = 1 + 0.07 * Math.sin(moonPop * Math.PI) * moonPop;
    const breathe = 1 + 0.03 * Math.sin(t * 0.9);
    const glow = (1 + moonPop * 0.6 + (celebrate > 0 ? 0.4 : 0) + resetFlash * 0.8) * breathe;
    const craters = [[-0.5, -0.38, 0.14], [0.45, 0.42, 0.18], [0.55, -0.3, 0.09], [-0.42, 0.5, 0.1], [0.05, -0.68, 0.07], [-0.72, 0.08, 0.07]];

    if (is3D) {
      const og = ctx.createRadialGradient(cx, cy, R * 0.8, cx, cy, R * 3.4 * glow);
      og.addColorStop(0, 'rgba(255,238,180,0.40)');
      og.addColorStop(0.35, 'rgba(255,225,160,0.12)');
      og.addColorStop(1, 'rgba(255,220,150,0)');
      ctx.fillStyle = og;
      ctx.beginPath(); ctx.arc(cx, cy, R * 3.4 * glow, 0, Math.PI * 2); ctx.fill();
    } else {
      // flat glow: soft concentric rings
      [[2.2, 0.06], [1.75, 0.08], [1.4, 0.11]].forEach(([k, a]) => {
        ctx.fillStyle = `rgba(255,236,170,${(a * glow).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(cx, cy, R * k * breathe, 0, Math.PI * 2); ctx.fill();
      });
    }

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(pop, pop);
    if (is3D) {
      ctx.shadowColor = 'rgba(255,236,170,0.9)';
      ctx.shadowBlur = R * 0.6 * glow;
      // lit sphere: bright upper-left, darker limb
      const mg = ctx.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.05, 0, 0, R);
      mg.addColorStop(0, '#fffdf2');
      mg.addColorStop(0.55, '#fff0c4');
      mg.addColorStop(0.9, '#ecd292');
      mg.addColorStop(1, '#d9bb76');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      // craters with an inner shadow and a lit rim
      ctx.save();
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.clip();
      for (const [x, y, r] of craters) {
        const X = x * R, Y = y * R, rr = r * R;
        const cg = ctx.createRadialGradient(X - rr * 0.35, Y - rr * 0.35, rr * 0.1, X, Y, rr);
        cg.addColorStop(0, 'rgba(170,140,80,0.45)');
        cg.addColorStop(1, 'rgba(210,185,125,0.18)');
        ctx.fillStyle = cg;
        ctx.beginPath(); ctx.arc(X, Y, rr, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,240,0.55)';
        ctx.lineWidth = Math.max(1, rr * 0.14);
        ctx.beginPath(); ctx.arc(X, Y, rr * 0.92, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
      }
      ctx.restore();
    } else {
      ctx.fillStyle = '#fff1c8';
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f2dea3';
      for (const [x, y, r] of craters) { ctx.beginPath(); ctx.arc(x * R, y * R, r * R, 0, Math.PI * 2); ctx.fill(); }
    }

    // the count
    const txt = String(count);
    const fs = R * (txt.length >= 3 ? 0.78 : 0.95);
    ctx.font = `600 ${fs}px Fredoka, ui-rounded, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const np = 1 + moonPop * 0.18 + resetFlash * 0.25;
    ctx.save();
    ctx.scale(np, np);
    if (is3D) {
      // engraved look: light lip below, glow around
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(txt, fs * 0.02, fs * 0.07);
      ctx.shadowColor = 'rgba(255,255,255,0.95)';
      ctx.shadowBlur = R * 0.18;
      ctx.fillStyle = '#2f3768';
      ctx.fillText(txt, 0, fs * 0.04);
    } else {
      ctx.fillStyle = '#2f3768';
      ctx.fillText(txt, 0, fs * 0.04);
    }
    ctx.restore();
    ctx.restore();

  }

  function groundLine(base, amp, freq, phase) {
    return x => base - amp - Math.sin(x / W * freq + phase) * amp * 0.5;
  }

  function fillHill(fn, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W + W / 40; x += W / 40) ctx.lineTo(x, fn(x));
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();
  }

  function drawLand(t) {
    const far = x => by - H * 0.075 - Math.sin(x / W * 5.2 + 1) * H * 0.03 - Math.sin(x / W * 11) * H * 0.01;
    const back = x => by - H * 0.02 - Math.sin(x / W * 3.1) * H * 0.012;
    const front = x => gy - H * 0.035 - Math.sin(x / W * 4 + 2) * H * 0.01;

    if (is3D) {
      const fg0 = ctx.createLinearGradient(0, by - H * 0.12, 0, by + H * 0.05);
      fg0.addColorStop(0, '#18244d'); fg0.addColorStop(1, '#0e1636');
      fillHill(far, fg0);
      const bg = ctx.createLinearGradient(0, by - H * 0.05, 0, H);
      bg.addColorStop(0, '#24405c'); bg.addColorStop(0.4, '#1a3149'); bg.addColorStop(1, '#0c1a2c');
      fillHill(back, bg);
      // moonlight on the crest of the back meadow
      ctx.strokeStyle = 'rgba(200,225,255,0.13)'; ctx.lineWidth = 3;
      ctx.beginPath(); for (let x = 0; x <= W; x += W / 30) x ? ctx.lineTo(x, back(x)) : ctx.moveTo(x, back(x)); ctx.stroke();
      const fgd = ctx.createLinearGradient(0, gy - H * 0.05, 0, H);
      fgd.addColorStop(0, '#2b5168'); fgd.addColorStop(0.35, '#1d3a50'); fgd.addColorStop(1, '#0d1d2d');
      fillHill(front, fgd);
      ctx.strokeStyle = 'rgba(200,230,255,0.16)'; ctx.lineWidth = 2;
      ctx.beginPath(); for (let x = 0; x <= W; x += W / 30) x ? ctx.lineTo(x, front(x)) : ctx.moveTo(x, front(x)); ctx.stroke();
      // grass blades with depth: smaller and dimmer further back
      for (let i = 0; i < 46; i++) {
        const xx = ((i * 0.6180339 * W * 1.7) % W);
        const d = ((i * 53) % 100) / 100;
        const yy = gy + H * 0.03 + d * H * 0.13;
        const s = 0.6 + d * 0.8;
        const sw = Math.sin(t * 1.3 + i) * 1.5 * s;
        ctx.strokeStyle = `rgba(130,180,200,${(0.15 + d * 0.25).toFixed(3)})`;
        ctx.lineWidth = 1 + d;
        ctx.beginPath();
        ctx.moveTo(xx, yy); ctx.quadraticCurveTo(xx - 2 * s, yy - 6 * s, xx - 3 * s + sw, yy - 10 * s);
        ctx.moveTo(xx, yy); ctx.quadraticCurveTo(xx + 1 * s, yy - 7 * s, xx + 2 * s + sw, yy - 12 * s);
        ctx.stroke();
      }
    } else {
      fillHill(far, '#141e44');
      fillHill(back, '#1d3550');
      fillHill(front, '#264a5e');
      ctx.fillStyle = '#1f3f52';
      ctx.fillRect(0, gy + H * 0.06, W, H);
      ctx.fillStyle = '#3b6a7c';
      for (let i = 0; i < 30; i++) {
        const xx = ((i * 0.6180339 * W * 1.7) % W);
        const yy = gy + H * 0.04 + ((i * 53) % 100) / 100 * H * 0.12;
        ctx.beginPath(); ctx.moveTo(xx - 4, yy); ctx.lineTo(xx - 1, yy - 9); ctx.lineTo(xx + 1, yy); ctx.lineTo(xx + 3, yy - 7); ctx.lineTo(xx + 5, yy); ctx.closePath(); ctx.fill();
      }
    }
  }

  function drawFence() {
    const w = u * 1.25, h = fenceH;
    const left = fx - w / 2, base = gy + u * 0.12;
    const postW = u * 0.16;
    const railH = u * 0.13;
    ctx.save();
    if (is3D) {
      const depth = u * 0.12; // extrusion towards the back-right
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(fx + depth, base, w * 0.7, u * 0.12, 0, 0, Math.PI * 2); ctx.fill();
      const rail = (y) => {
        const x0 = left - u * 0.12, x1 = left + w + u * 0.12;
        // top face
        ctx.fillStyle = '#9b8068';
        ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + depth, y - depth * 0.6); ctx.lineTo(x1 + depth, y - depth * 0.6); ctx.lineTo(x1, y); ctx.closePath(); ctx.fill();
        // front face
        const g = ctx.createLinearGradient(0, y, 0, y + railH);
        g.addColorStop(0, '#866b55'); g.addColorStop(1, '#5c4738');
        ctx.fillStyle = g;
        ctx.fillRect(x0, y, x1 - x0, railH);
        // end face
        ctx.fillStyle = '#4a392d';
        ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x1 + depth, y - depth * 0.6); ctx.lineTo(x1 + depth, y - depth * 0.6 + railH); ctx.lineTo(x1, y + railH); ctx.closePath(); ctx.fill();
      };
      const post = (x) => {
        const xl = x - postW / 2, xr = x + postW / 2, top = base - h;
        // side face
        ctx.fillStyle = '#463529';
        ctx.beginPath(); ctx.moveTo(xr, base); ctx.lineTo(xr, top); ctx.lineTo(xr + depth, top - depth * 0.6); ctx.lineTo(xr + depth, base - depth * 0.6); ctx.closePath(); ctx.fill();
        // front face
        const g = ctx.createLinearGradient(xl, 0, xr, 0);
        g.addColorStop(0, '#8e735d'); g.addColorStop(1, '#6a5242');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(xl, base); ctx.lineTo(xl, top); ctx.lineTo(x, top - postW * 0.6); ctx.lineTo(xr, top); ctx.lineTo(xr, base); ctx.closePath(); ctx.fill();
        // pointed cap top face
        ctx.fillStyle = '#a58a72';
        ctx.beginPath(); ctx.moveTo(x, top - postW * 0.6); ctx.lineTo(xr, top); ctx.lineTo(xr + depth, top - depth * 0.6); ctx.lineTo(x + depth, top - postW * 0.6 - depth * 0.6); ctx.closePath(); ctx.fill();
        // wood grain
        ctx.strokeStyle = 'rgba(40,28,20,0.35)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x - postW * 0.1, top + h * 0.15); ctx.lineTo(x - postW * 0.05, base - h * 0.1); ctx.stroke();
      };
      // back rails behind posts? rails are nailed to the front, so draw posts first
      for (const x of [left, fx, left + w]) post(x);
      rail(base - h * 0.78);
      rail(base - h * 0.4);
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(fx - w * 0.65, base - u * 0.04, w * 1.3, u * 0.08);
      for (const x of [left, fx, left + w]) {
        ctx.fillStyle = '#6b5444';
        ctx.beginPath();
        ctx.moveTo(x - postW / 2, base); ctx.lineTo(x - postW / 2, base - h);
        ctx.lineTo(x, base - h - postW * 0.6); ctx.lineTo(x + postW / 2, base - h); ctx.lineTo(x + postW / 2, base);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = '#7f6653';
      ctx.fillRect(left - u * 0.12, base - h * 0.78, w + u * 0.24, railH);
      ctx.fillRect(left - u * 0.12, base - h * 0.4, w + u * 0.24, railH);
    }
    ctx.restore();
  }

  function legAngles(sh, jt) {
    // returns [backA, backB, frontA, frontB] angles and leg length scale; positive angle swings foot backward
    const w = sh.moving ? Math.sin(sh.legPh) * 0.5 : 0;
    let a = [w, -w, -w, w], len = 1;
    if (jt == null) return { a, len, rot: 0, sx: 1, wink: false, happy: false };
    const e = Math.sin(Math.PI * jt);
    let rot = 0, sx = 1, wink = false;
    switch (sh.pose) {
      case 'star':     a = [1.1 * e, 0.8 * e, -1.1 * e, -0.8 * e]; rot = -0.12 * e; break;
      case 'superman': a = [1.4 * e, 1.3 * e, -1.6 * e, -1.5 * e]; rot = -0.28 * e; break;
      case 'spin':     a = [-0.7 * e, -0.7 * e, 0.7 * e, 0.7 * e]; len = 1 - 0.45 * e; rot = Math.PI * 2 * ease(jt); break;
      case 'backflip': a = [-0.7 * e, -0.7 * e, 0.7 * e, 0.7 * e]; len = 1 - 0.45 * e; rot = -Math.PI * 2 * ease(jt); break;
      case 'tuck':     a = [-0.9 * e, -0.9 * e, 0.9 * e, 0.9 * e]; len = 1 - 0.6 * e; rot = 0.1 * Math.sin(jt * 18) * e; break;
      case 'wave':     a = [0.4 * e, 0.4 * e, -2.3 * e + Math.sin(jt * 34) * 0.45 * e, -0.3 * e]; rot = -0.08 * e; wink = true; break;
      case 'twirl':    a = [0.3 * e, -0.3 * e, -0.3 * e, 0.3 * e]; sx = Math.cos(Math.PI * 2 * ease(jt)); break;
      case 'kick':     a = [2.0 * e, 1.8 * e, -0.5 * e, -0.3 * e]; rot = 0.25 * e; break;
    }
    return { a, len, rot, sx, wink, happy: true };
  }

  // A shaded ball for 3D wool and heads. The light stays fixed in world space,
  // so it is passed in already converted to the sheep's local frame.
  function ball(x, y, r, base, lit, dark, lx, ly) {
    const g = ctx.createRadialGradient(x + lx * r * 0.55, y + ly * r * 0.55, r * 0.08, x, y, r);
    g.addColorStop(0, lit);
    g.addColorStop(0.6, base);
    g.addColorStop(1, dark);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  function drawSheep(sh, t) {
    const p = posAt(sh.s);
    const depth = Math.min(1, Math.max(0, (p.y - by) / (gy - by)));
    const sc = lerp(0.68, 1, depth);
    const s = ((sh.s % 1) + 1) % 1;
    let jt = null, lift = 0;
    if (sh.pose && s >= Sj && s < Sj + Jl) {
      jt = (s - Sj) / Jl;
      lift = Math.sin(Math.PI * jt) * jumpH;
    }
    const facing = p.dx >= 0 ? 1 : -1;
    const U = u * sc;
    const bob = sh.moving && jt == null ? Math.abs(Math.sin(sh.legPh)) * U * 0.05 : 0;
    const x = p.x, y = p.y - lift - bob;

    // ground shadow
    const sa = 0.28 * (1 - Math.min(1, lift / jumpH) * 0.6);
    if (is3D) {
      const sg = ctx.createRadialGradient(x, p.y, 0, x, p.y, U * 0.75);
      sg.addColorStop(0, `rgba(0,0,0,${(sa * 1.4).toFixed(3)})`);
      sg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sg;
      ctx.save(); ctx.translate(x, p.y + U * 0.02); ctx.scale(1 - lift / jumpH * 0.4, 0.18);
      ctx.beginPath(); ctx.arc(0, 0, U * 0.75, 0, Math.PI * 2);
      ctx.restore();
      ctx.fill();
    } else {
      ctx.fillStyle = `rgba(0,0,0,${sa.toFixed(3)})`;
      ctx.beginPath();
      ctx.ellipse(x, p.y + U * 0.02, U * 0.7 * (1 - lift / jumpH * 0.4), U * 0.12, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    const P = legAngles(sh, jt);
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(facing * sc, sc);
    const bcY = -u * 0.78;
    ctx.translate(0, bcY);
    ctx.rotate(P.rot);
    ctx.scale(P.sx || 0.001, 1);
    ctx.translate(0, -bcY);

    // light direction in the sheep's own frame (undo facing flip and body rotation)
    const cr = Math.cos(-P.rot), sr = Math.sin(-P.rot);
    let lx = LIGHT.x * facing, ly = LIGHT.y;
    [lx, ly] = [lx * cr - ly * sr, lx * sr + ly * cr];
    if (P.sx < 0) lx = -lx;

    const legLen = u * 0.46 * P.len;
    const hipY = -u * 0.46;
    const leg = (hx, ang, far) => {
      ctx.save();
      ctx.translate(hx, hipY);
      ctx.rotate(ang);
      if (is3D) {
        const g = ctx.createLinearGradient(-u * 0.065, 0, u * 0.065, 0);
        g.addColorStop(0, far ? '#2a2f45' : '#4a5172');
        g.addColorStop(0.5, far ? '#1c2033' : '#2f3550');
        g.addColorStop(1, far ? '#101320' : '#1a1e30');
        ctx.strokeStyle = g;
      } else {
        ctx.strokeStyle = far ? '#1c2033' : '#2a2f45';
      }
      ctx.lineWidth = u * 0.13;
      ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, legLen); ctx.stroke();
      ctx.fillStyle = '#12141f';
      ctx.beginPath(); ctx.arc(0, legLen, u * 0.075, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    };
    leg(-u * 0.32, P.a[1], true);
    leg(u * 0.38, P.a[3], true);

    const woolLit = '#ffffff', woolDark = sh.wool === '#f3e9dc' ? '#b9ab98' : '#a9b0c8';
    // tail
    if (is3D) ball(-u * 0.68, -u * 0.86, u * 0.14, sh.wool, woolLit, woolDark, lx, ly);
    else { ctx.fillStyle = sh.wool; ctx.beginPath(); ctx.arc(-u * 0.68, -u * 0.86, u * 0.14, 0, Math.PI * 2); ctx.fill(); }

    // fluffy body
    const puffs = [[-0.42, -0.72, 0.3], [-0.18, -0.98, 0.32], [0.18, -1.0, 0.31], [0.42, -0.76, 0.3], [0.12, -0.6, 0.32], [-0.2, -0.6, 0.31], [0, -0.82, 0.38]];
    if (is3D) {
      // soft contact shadow under the fleece, then each puff as a lit ball
      ctx.fillStyle = 'rgba(10,14,30,0.35)';
      ctx.beginPath(); ctx.ellipse(0, -u * 0.5, u * 0.62, u * 0.16, 0, 0, Math.PI * 2); ctx.fill();
      for (const [px, py, r] of puffs) ball(px * u, py * u, r * u, sh.wool, woolLit, woolDark, lx, ly);
    } else {
      ctx.fillStyle = sh.wool;
      for (const [px, py, r] of puffs) { ctx.beginPath(); ctx.arc(px * u, py * u, r * u * 0.96, 0, Math.PI * 2); ctx.fill(); }
      // one flat curl line for texture
      ctx.strokeStyle = 'rgba(160,168,196,0.6)'; ctx.lineWidth = u * 0.03; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(-u * 0.12, -u * 0.72, u * 0.12, 0.2, Math.PI - 0.2); ctx.stroke();
      ctx.beginPath(); ctx.arc(u * 0.2, -u * 0.8, u * 0.1, 0.2, Math.PI - 0.2); ctx.stroke();
    }

    leg(-u * 0.22, P.a[0], false);
    leg(u * 0.48, P.a[2], false);

    // head
    const hx = u * 0.66, hy = -u * 0.98 + (jt == null ? Math.sin(t * 2 + sh.bob) * u * 0.015 : 0);
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(jt == null ? 0.15 : -0.1);
    ctx.fillStyle = '#2a2f45';
    ctx.save(); ctx.translate(-u * 0.12, -u * 0.12); ctx.rotate(-0.9 + (jt != null ? -0.5 * Math.sin(Math.PI * jt) : 0));
    ctx.beginPath(); ctx.ellipse(-u * 0.1, 0, u * 0.13, u * 0.055, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    if (is3D) {
      ctx.save(); ctx.rotate(0.25); ctx.scale(1, 0.86);
      ball(0, 0, u * 0.22, '#353b56', '#5d6690', '#1a1e30', lx, ly);
      ctx.restore();
      ball(u * 0.14, u * 0.05, u * 0.115, '#383e5a', '#5a6389', '#1d2134', lx, ly);
      ball(-u * 0.04, -u * 0.17, u * 0.1, sh.wool, woolLit, woolDark, lx, ly);
      ball(u * 0.07, -u * 0.18, u * 0.08, sh.wool, woolLit, woolDark, lx, ly);
    } else {
      ctx.fillStyle = '#353b56';
      ctx.beginPath(); ctx.ellipse(0, 0, u * 0.22, u * 0.19, 0.25, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(u * 0.14, u * 0.05, u * 0.12, u * 0.1, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = sh.wool;
      ctx.beginPath(); ctx.arc(-u * 0.04, -u * 0.17, u * 0.1, 0, Math.PI * 2); ctx.arc(u * 0.07, -u * 0.18, u * 0.08, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = '#ffffff'; ctx.fillStyle = '#ffffff';
    ctx.lineWidth = u * 0.035; ctx.lineCap = 'round';
    if (P.happy) {
      ctx.beginPath();
      if (P.wink) { ctx.moveTo(u * 0.02, -u * 0.01); ctx.lineTo(u * 0.12, -u * 0.01); }
      else { ctx.moveTo(u * 0.01, 0); ctx.lineTo(u * 0.065, -u * 0.06); ctx.lineTo(u * 0.12, 0); }
      ctx.stroke();
      ctx.fillStyle = '#f19aa8';
      ctx.beginPath(); ctx.arc(u * 0.2, u * 0.08, u * 0.045, 0, Math.PI); ctx.fill();
    } else {
      const blink = (Math.sin(t * 0.7 + sh.bob * 3) > 0.985);
      if (blink) { ctx.beginPath(); ctx.moveTo(u * 0.02, -u * 0.02); ctx.lineTo(u * 0.12, -u * 0.02); ctx.stroke(); }
      else {
        ctx.beginPath(); ctx.arc(u * 0.07, -u * 0.02, u * 0.045, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#12141f';
        ctx.beginPath(); ctx.arc(u * 0.085, -u * 0.02, u * 0.022, 0, Math.PI * 2); ctx.fill();
        if (is3D) { ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(u * 0.078, -u * 0.032, u * 0.008, 0, Math.PI * 2); ctx.fill(); }
      }
    }
    ctx.fillStyle = 'rgba(241,154,168,0.35)';
    ctx.beginPath(); ctx.arc(u * 0.02, u * 0.07, u * 0.04, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  function draw(t, dt) {
    drawSky(t);
    drawShooters(dt);
    drawMoon(t, dt);
    drawLand(t);
    const withY = sheep.map(sh => ({ sh, y: posAt(sh.s).y }));
    const back = withY.filter(o => o.y < gy - 0.5).sort((a, b) => a.y - b.y);
    const front = withY.filter(o => o.y >= gy - 0.5);
    for (const o of back) drawSheep(o.sh, t);
    drawFence();
    // the jumper is drawn last so it flies over its queue-mates
    front.sort((a, b) => (a.sh.pose ? 1 : 0) - (b.sh.pose ? 1 : 0));
    for (const o of front) drawSheep(o.sh, t);
  }

  // ---------- 3D mode: real 3D models with tilt (gyroscope) parallax ----------
  // Built with three.js. The same sheep simulation drives both modes: the 2D lap path
  // is mapped onto the ground plane, front lane at z = 0 and the return lane further back.
  function create3D() {
    if (!window.THREE) return null;
    const T = window.THREE;
    let renderer;
    try {
      renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'low-power' });
    } catch (e) { return null; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = T.PCFSoftShadowMap;
    const el = renderer.domElement;
    el.id = 'sky3d';
    el.setAttribute('aria-label', cv.getAttribute('aria-label'));
    el.hidden = true;
    document.body.insertBefore(el, cv.nextSibling);

    const scene = new T.Scene();
    scene.fog = new T.FogExp2(0x0d1638, 0.018);
    const camera = new T.PerspectiveCamera(38, 1, 0.1, 400);
    const WORLD_W = 16, DEPTH = 5.2;
    const target = new T.Vector3(0, 1.5, -1.5);
    const camBase = new T.Vector3(0, 2.5, 10.5);

    // sky backdrop
    const skyC = document.createElement('canvas'); skyC.width = 4; skyC.height = 256;
    const sg = skyC.getContext('2d'); const grd = sg.createLinearGradient(0, 0, 0, 256);
    grd.addColorStop(0, '#04071a'); grd.addColorStop(0.6, '#0d1638'); grd.addColorStop(1, '#1b2a57');
    sg.fillStyle = grd; sg.fillRect(0, 0, 4, 256);
    const skyTex = new T.CanvasTexture(skyC);
    scene.background = skyTex;

    // lights: cool ambient, warm moon key light (casts shadows), soft front fill
    scene.add(new T.HemisphereLight(0x8a9ad8, 0x16223a, 0.75));
    const key = new T.DirectionalLight(0xfff0d0, 0.95);
    key.position.set(-5, 14, -14);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    Object.assign(key.shadow.camera, { left: -13, right: 13, top: 10, bottom: -10, near: 1, far: 50 });
    key.shadow.radius = 4;
    scene.add(key);
    const fill = new T.DirectionalLight(0xa9b8ff, 0.55);
    fill.position.set(4, 6, 14);
    scene.add(fill);

    // stars at three depths so tilting reveals parallax
    const dot = document.createElement('canvas'); dot.width = dot.height = 32;
    const dg = dot.getContext('2d'); const rg = dg.createRadialGradient(16, 16, 0, 16, 16, 16);
    rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(0.35, 'rgba(255,255,255,0.8)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
    dg.fillStyle = rg; dg.fillRect(0, 0, 32, 32);
    const dotTex = new T.CanvasTexture(dot);
    const starLayers = [];
    [[60, 380, 0.55], [100, 520, 0.8], [160, 700, 1.15]].forEach(([dist, n, size], i) => {
      const pos = new Float32Array(n * 3);
      for (let k = 0; k < n; k++) {
        const az = rand(-1.25, 1.25), el2 = Math.pow(Math.random(), 0.8) * 1.2 + 0.03;
        pos[k * 3] = Math.sin(az) * Math.cos(el2) * dist;
        pos[k * 3 + 1] = Math.sin(el2) * dist * 0.75 - 2;
        pos[k * 3 + 2] = -Math.cos(az) * Math.cos(el2) * dist;
      }
      const g = new T.BufferGeometry(); g.setAttribute('position', new T.BufferAttribute(pos, 3));
      const m = new T.PointsMaterial({ size: size * (dist / 60), map: dotTex, transparent: true, depthWrite: false, fog: false, color: i === 1 ? 0xdfe6ff : 0xffffff });
      const pts = new T.Points(g, m); scene.add(pts); starLayers.push(pts);
    });

    // moon: lit sphere with craters, a glow sprite, and the count floating in front
    const MOON_POS = new T.Vector3(0, 8.4, -36), MOON_R = 3.9;
    const mc = document.createElement('canvas'); mc.width = 1024; mc.height = 512;
    const mx = mc.getContext('2d');
    mx.fillStyle = '#fff1c8'; mx.fillRect(0, 0, 1024, 512);
    for (let i = 0; i < 70; i++) {
      const x = Math.random() * 1024, y = 60 + Math.random() * 392, r = 8 + Math.pow(Math.random(), 2) * 46;
      mx.fillStyle = 'rgba(205,178,118,0.45)'; mx.beginPath(); mx.arc(x, y, r, 0, Math.PI * 2); mx.fill();
      mx.strokeStyle = 'rgba(255,255,240,0.5)'; mx.lineWidth = r * 0.12; mx.beginPath(); mx.arc(x, y, r * 0.9, 0.2, Math.PI - 0.2); mx.stroke();
    }
    const moonTex = new T.CanvasTexture(mc);
    const moon = new T.Mesh(new T.SphereGeometry(MOON_R, 48, 32),
      new T.MeshStandardMaterial({ map: moonTex, emissive: 0xffe9b0, emissiveIntensity: 0.55, roughness: 1, fog: false }));
    moon.position.copy(MOON_POS);
    scene.add(moon);
    const moonLight = new T.PointLight(0xfff3d6, 0.9, 40);
    moonLight.position.copy(MOON_POS).add(new T.Vector3(-3, 3, 12));
    scene.add(moonLight);

    const gc = document.createElement('canvas'); gc.width = gc.height = 256;
    const gx = gc.getContext('2d'); const gg = gx.createRadialGradient(128, 128, 30, 128, 128, 128);
    gg.addColorStop(0, 'rgba(255,236,170,0.75)'); gg.addColorStop(0.35, 'rgba(255,225,160,0.22)'); gg.addColorStop(1, 'rgba(255,220,150,0)');
    gx.fillStyle = gg; gx.fillRect(0, 0, 256, 256);
    const glow = new T.Sprite(new T.SpriteMaterial({ map: new T.CanvasTexture(gc), blending: T.AdditiveBlending, depthWrite: false, fog: false, transparent: true }));
    glow.position.copy(MOON_POS).add(new T.Vector3(0, 0, -MOON_R * 0.5));
    glow.scale.set(MOON_R * 7, MOON_R * 7, 1);
    scene.add(glow);

    const nc = document.createElement('canvas'); nc.width = 512; nc.height = 320;
    const nx = nc.getContext('2d');
    const numTex = new T.CanvasTexture(nc);
    const num = new T.Sprite(new T.SpriteMaterial({ map: numTex, transparent: true, depthTest: false, fog: false }));
    num.position.copy(MOON_POS).add(new T.Vector3(0, 0, MOON_R + 0.2));
    num.renderOrder = 5;
    scene.add(num);
    let shownCount = -1;
    function paintCount() {
      shownCount = count;
      nx.clearRect(0, 0, 512, 320);
      const txt = String(count);
      nx.font = `600 ${txt.length >= 3 ? 190 : 230}px Fredoka, ui-rounded, system-ui, sans-serif`;
      nx.textAlign = 'center'; nx.textBaseline = 'middle';
      nx.fillStyle = 'rgba(255,255,255,0.85)'; nx.fillText(txt, 262, 178);
      nx.shadowColor = 'rgba(255,255,255,0.95)'; nx.shadowBlur = 26;
      nx.fillStyle = '#2f3768'; nx.fillText(txt, 256, 170);
      nx.shadowBlur = 0;
      numTex.needsUpdate = true;
    }
    if (document.fonts && document.fonts.load) document.fonts.load('600 100px Fredoka').then(() => { shownCount = -1; }).catch(() => {});

    // land: front meadow, rolling far hills, grass tufts
    const ground = new T.Mesh(new T.PlaneGeometry(120, 80, 60, 40), new T.MeshStandardMaterial({ color: 0x24475b, roughness: 1 }));
    {
      const p = ground.geometry.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const x = p.getX(i), y = p.getY(i); // plane y becomes -z
        const z = -y;
        const flat = z > -DEPTH - 2.5 && z < 4 && Math.abs(x) < 13; // keep the lanes level
        p.setZ(i, flat ? 0 : Math.max(0, (Math.sin(x * 0.18) + Math.cos(z * 0.21)) * 0.6 + (z < -DEPTH - 2.5 ? (-z - DEPTH - 2.5) * 0.12 : 0)));
      }
      ground.geometry.computeVertexNormals();
    }
    ground.rotation.x = -Math.PI / 2;
    ground.position.z = 0;
    ground.receiveShadow = true;
    scene.add(ground);
    const hillMat = [0x162350, 0x1b3150, 0x13204a].map(c => new T.MeshStandardMaterial({ color: c, roughness: 1 }));
    [[-20, -34, 16, 5, 0], [6, -42, 22, 7, 2], [26, -30, 14, 4.5, 1], [-6, -26, 12, 3.2, 1], [16, -22, 10, 2.6, 0]].forEach(([x, z, r, h, m]) => {
      const hill = new T.Mesh(new T.SphereGeometry(1, 32, 16), hillMat[m]);
      hill.scale.set(r, h, r * 0.55); hill.position.set(x, -0.3, z); hill.receiveShadow = true;
      scene.add(hill);
    });
    {
      const n = 520;
      const blade = new T.ConeGeometry(0.03, 0.22, 4); blade.translate(0, 0.11, 0);
      const grass = new T.InstancedMesh(blade, new T.MeshStandardMaterial({ color: 0x2f5a6c, roughness: 1 }), n);
      const m = new T.Matrix4(), q = new T.Quaternion(), e = new T.Euler(), s = new T.Vector3(), pp = new T.Vector3();
      for (let i = 0; i < n; i++) {
        let x, z;
        do { x = rand(-15, 15); z = rand(-DEPTH - 3, 5); } while ((Math.abs(z) < 0.7 || Math.abs(z + DEPTH) < 0.7) && Math.abs(x) < 9);
        e.set(rand(-0.25, 0.25), rand(0, 6), rand(-0.25, 0.25)); q.setFromEuler(e);
        const k = rand(0.6, 1.4); s.set(k, k, k); pp.set(x, 0, z);
        m.compose(pp, q, s); grass.setMatrixAt(i, m);
      }
      scene.add(grass);
    }

    // fence: posts with pointed caps and two rails, all real boxes
    const wood = new T.MeshStandardMaterial({ color: 0x7a604c, roughness: 0.9 });
    const woodDark = new T.MeshStandardMaterial({ color: 0x5f4a3a, roughness: 0.95 });
    const fence = new T.Group();
    {
      const w = 1.25, h = 1.05, pw = 0.16;
      for (const x of [-w / 2, 0, w / 2]) {
        const post = new T.Mesh(new T.BoxGeometry(pw, h, pw), woodDark); post.position.set(x, h / 2 - 0.05, 0);
        const cap = new T.Mesh(new T.ConeGeometry(pw * 0.72, pw * 0.8, 4), woodDark); cap.position.set(x, h - 0.05 + pw * 0.4, 0); cap.rotation.y = Math.PI / 4;
        fence.add(post, cap);
      }
      for (const y of [h * 0.72, h * 0.36]) {
        const rail = new T.Mesh(new T.BoxGeometry(w + 0.3, 0.13, 0.07), wood); rail.position.set(0, y, pw / 2 + 0.04);
        fence.add(rail);
      }
      fence.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    }
    scene.add(fence);

    // sheep model, in the same units as 2D (u = 1), feet at the origin, facing +x
    const darkMat = new T.MeshStandardMaterial({ color: 0x353b56, roughness: 0.75 });
    const legMat = new T.MeshStandardMaterial({ color: 0x2a2f45, roughness: 0.8 });
    const hoofMat = new T.MeshStandardMaterial({ color: 0x12141f, roughness: 0.6 });
    const eyeMat = new T.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
    const pupilMat = new T.MeshStandardMaterial({ color: 0x0e1018, roughness: 0.2 });
    const cheekMat = new T.MeshStandardMaterial({ color: 0xf19aa8, roughness: 0.8, transparent: true, opacity: 0.6 });
    const ballG = new T.SphereGeometry(1, 20, 14);
    const legG = new T.CylinderGeometry(0.06, 0.055, 1, 10); legG.translate(0, -0.5, 0);
    const hoofG = new T.SphereGeometry(0.075, 10, 8);
    const woolMats = {};
    const woolMat = c => woolMats[c] || (woolMats[c] = new T.MeshStandardMaterial({ color: c, roughness: 1 }));
    function ballMesh(mat, r, x, y, z, sx = 1, sy = 1, sz = 1) {
      const m = new T.Mesh(ballG, mat); m.scale.set(r * sx, r * sy, r * sz); m.position.set(x, y, z); return m;
    }

    function makeSheep(sh) {
      const root = new T.Group();      // placed on the path, turned to face travel
      const pivot = new T.Group();     // rotates around the body centre for poses
      pivot.position.y = 0.78;
      const body = new T.Group();
      body.position.y = -0.78;
      root.add(pivot); pivot.add(body);
      const wm = woolMat(sh.wool);
      const puffs = [[-0.42, 0.72, 0, 0.3], [-0.18, 0.98, 0.05, 0.32], [0.18, 1.0, -0.04, 0.31], [0.42, 0.76, 0.02, 0.3], [0.12, 0.6, 0.14, 0.32], [-0.2, 0.6, -0.14, 0.31], [0, 0.82, 0, 0.4],
        [-0.2, 0.8, 0.24, 0.27], [0.2, 0.82, -0.24, 0.27], [0.2, 0.78, 0.22, 0.27], [-0.22, 0.82, -0.22, 0.27]];
      for (const [x, y, z, r] of puffs) body.add(ballMesh(wm, r, x, y, z));
      body.add(ballMesh(wm, 0.14, -0.68, 0.86, 0));
      const legs = [];
      for (const [x, z] of [[-0.22, 0.15], [-0.32, -0.15], [0.48, 0.15], [0.38, -0.15]]) {
        const g = new T.Group(); g.position.set(x, 0.46, z);
        const leg = new T.Mesh(legG, legMat); leg.scale.y = 0.46;
        const hoof = new T.Mesh(hoofG, hoofMat); hoof.position.y = -0.46;
        g.add(leg, hoof); body.add(g); legs.push({ g, leg, hoof });
      }
      const head = new T.Group(); head.position.set(0.68, 0.98, 0); head.rotation.z = -0.15;
      head.add(ballMesh(darkMat, 0.22, 0, 0, 0, 1.05, 0.88, 0.85));
      head.add(ballMesh(darkMat, 0.12, 0.15, -0.06, 0, 1, 0.85, 0.85));
      const ears = [];
      for (const s of [1, -1]) {
        const ear = ballMesh(darkMat, 0.13, -0.1, 0.06, 0.17 * s, 1, 0.42, 0.6);
        ear.rotation.set(0.5 * s, 0, 0.6); head.add(ear); ears.push(ear);
      }
      head.add(ballMesh(wm, 0.11, -0.04, 0.17, 0.03), ballMesh(wm, 0.09, 0.07, 0.18, -0.04));
      const eyes = [];
      for (const s of [1, -1]) {
        const eye = ballMesh(eyeMat, 0.05, 0.1, 0.03, 0.135 * s);
        const pupil = ballMesh(pupilMat, 0.026, 0.13, 0.03, 0.16 * s);
        head.add(eye, pupil); eyes.push(eye, pupil);
        head.add(ballMesh(cheekMat, 0.04, 0.12, -0.07, 0.16 * s));
      }
      body.add(head);
      root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      scene.add(root);
      return { root, pivot, legs, head, eyes, ears };
    }
    const models = sheep.map(makeSheep);

    // path mapping and camera framing
    let k = WORLD_W / W;
    const to3 = (f) => {
      const p = posAt(f);
      const d = Math.min(1, Math.max(0, (gy - p.y) / (gy - by)));
      return { x: (p.x - W / 2) * k, z: -d * DEPTH };
    };
    let sizeW = 0, sizeH = 0;
    function resize3() {
      sizeW = W; sizeH = H;
      k = WORLD_W / W;
      renderer.setSize(W, H, false);
      el.style.width = '100%'; el.style.height = '100%';
      camera.aspect = W / H;
      // keep the whole front lane in view on narrow screens
      const halfW = (W / 2) * k - 0.6;
      const needDist = halfW / (Math.tan(T.MathUtils.degToRad(camera.fov / 2)) * camera.aspect);
      camBase.z = Math.max(10.5, needDist + 0.6);
      camera.updateProjectionMatrix();
    }

    // tilt input: gyroscope first, then drag / mouse, else a slow idle sway
    const tilt = { x: 0, y: 0, tx: 0, ty: 0, src: 'idle', base: null, lastInput: 0 };
    function onOrient(e) {
      if (e.beta == null || e.gamma == null) return;
      const ang = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle : (window.orientation || 0);
      let x, y;
      if (ang === 90) { x = e.beta; y = -e.gamma; }
      else if (ang === 270 || ang === -90) { x = -e.beta; y = e.gamma; }
      else { x = e.gamma; y = e.beta; }
      if (!tilt.base) tilt.base = { x, y };
      // let the resting position drift slowly so the view re-centres on how the phone is held
      tilt.base.x += (x - tilt.base.x) * 0.004;
      tilt.base.y += (y - tilt.base.y) * 0.004;
      tilt.tx = Math.max(-1, Math.min(1, (x - tilt.base.x) / 20));
      tilt.ty = Math.max(-1, Math.min(1, (y - tilt.base.y) / 20));
      tilt.src = 'gyro'; tilt.lastInput = performance.now();
    }
    window.addEventListener('deviceorientation', onOrient);
    async function askMotion() {
      try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
          await DeviceOrientationEvent.requestPermission();
        }
      } catch (e) {}
    }
    let drag = null;
    el.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, tx: tilt.tx, ty: tilt.ty }; });
    window.addEventListener('pointerup', () => { drag = null; });
    window.addEventListener('pointermove', e => {
      if (el.hidden || tilt.src === 'gyro') return;
      if (drag) {
        tilt.tx = Math.max(-1, Math.min(1, drag.tx + (e.clientX - drag.x) / (W * 0.35)));
        tilt.ty = Math.max(-1, Math.min(1, drag.ty + (e.clientY - drag.y) / (H * 0.35)));
      } else return;
      tilt.src = 'pointer'; tilt.lastInput = performance.now();
    });

    const tmpV = new T.Vector3(), tmpE = new T.Vector3();
    function render(t, dt) {
      if (sizeW !== W || sizeH !== H) resize3();
      moonPop = Math.max(0, moonPop - dt * 2.2);
      resetFlash = Math.max(0, resetFlash - dt * 1.2);
      if (count !== shownCount) paintCount();

      // tilt → camera offset (near things shift more than far ones: depth)
      if (performance.now() - tilt.lastInput > 4000 && tilt.src !== 'gyro') {
        tilt.tx = Math.sin(t * 0.21) * 0.35; tilt.ty = Math.sin(t * 0.13) * 0.2;
      }
      tilt.x += (tilt.tx - tilt.x) * Math.min(1, dt * 5);
      tilt.y += (tilt.ty - tilt.y) * Math.min(1, dt * 5);
      camera.position.set(camBase.x + tilt.x * 2.6, camBase.y - tilt.y * 0.9, camBase.z);
      camera.lookAt(target);

      // stars twinkle by layer
      starLayers.forEach((s, i) => { s.material.opacity = 0.65 + 0.35 * Math.sin(t * (0.8 + i * 0.5) + i * 2); });

      // moon pulse and glow
      const pop = 1 + 0.07 * Math.sin(moonPop * Math.PI) * moonPop + resetFlash * 0.06;
      moon.scale.setScalar(pop);
      moon.rotation.y = t * 0.02;
      const g = (1 + moonPop * 0.5 + (celebrate > 0 ? 0.4 : 0) + resetFlash * 0.7) * (1 + 0.03 * Math.sin(t * 0.9));
      glow.scale.set(MOON_R * 7 * g, MOON_R * 7 * g, 1);
      const np = MOON_R * 1.55 * (1 + moonPop * 0.18 + resetFlash * 0.25);
      num.scale.set(np, np * 320 / 512, 1);

      // fence size follows the 2D layout
      const uk = u * k;
      fence.scale.setScalar(uk);
      fence.position.set((fx - W / 2) * k, 0, 0);

      // sheep
      for (let i = 0; i < sheep.length; i++) {
        const sh = sheep[i], m = models[i];
        const s = ((sh.s % 1) + 1) % 1;
        const a = to3(s), b = to3(s + 0.003);
        let jt = null, lift = 0;
        if (sh.pose && s >= Sj && s < Sj + Jl) { jt = (s - Sj) / Jl; lift = Math.sin(Math.PI * jt) * jumpH * k; }
        const bob = sh.moving && jt == null ? Math.abs(Math.sin(sh.legPh)) * uk * 0.05 : 0;
        m.root.position.set(a.x, lift + bob, a.z);
        m.root.scale.setScalar(uk);
        const dx = b.x - a.x, dz = b.z - a.z;
        if (Math.abs(dx) + Math.abs(dz) > 1e-6) m.root.rotation.y = Math.atan2(-dz, dx);
        const P = legAngles(sh, jt);
        m.pivot.rotation.set(0, 0, -P.rot);
        if (sh.pose === 'twirl' && jt != null) { m.pivot.rotation.set(Math.PI * 2 * ease(jt), 0, 0); }
        m.legs.forEach((L, j) => { L.g.rotation.z = -P.a[j]; L.g.scale.y = P.len; });
        // happy squint while jumping, ears flap
        const sq = jt != null ? 0.35 : (Math.sin(t * 0.7 + sh.bob * 3) > 0.985 ? 0.15 : 1);
        m.eyes.forEach(e => { e.scale.y = e.scale.x * sq; });
        m.ears.forEach((e, j) => { e.rotation.z = 0.6 + (jt != null ? 0.5 * Math.sin(Math.PI * jt) : 0); });
        m.head.rotation.z = jt == null ? -0.15 + Math.sin(t * 2 + sh.bob) * 0.03 : 0.1;
      }

      renderer.render(scene, camera);

      // where the moon is on screen, for the double-tap reset
      tmpV.copy(MOON_POS).project(camera);
      tmpE.copy(MOON_POS).add(new T.Vector3(MOON_R, 0, 0)).project(camera);
      moonGeom.cx = (tmpV.x + 1) / 2 * W; moonGeom.cy = (1 - tmpV.y) / 2 * H;
      moonGeom.R = Math.abs(tmpE.x - tmpV.x) / 2 * W;
    }

    return {
      el, render, askMotion,
      show(on) { el.hidden = !on; cv.hidden = on; if (on) resize3(); },
    };
  }

  // ---------- loop ----------
  function resize() {
    const fracs = sheep.map(s => s.s);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    u = Math.max(18, Math.min(H * 0.105, W * 0.055));
    buildPath();
    buildStars();
    if (!fracs.length) placeSheep();
  }

  let last = performance.now(), running = true, nextShooter = rand(4, 9);
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (running) {
      step(dt);
      nextShooter -= dt;
      if (nextShooter <= 0) { spawnShooter(false); nextShooter = rand(6, 14); }
      celebrate = Math.max(0, celebrate - dt);
      if (is3D && three) three.render(now / 1000, dt); else draw(now / 1000, dt);
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  const three = create3D();
  requestAnimationFrame(frame);

  // keep the screen awake while counting, when the browser allows it
  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  keepAwake();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && running) keepAwake(); });

  // ---------- art style ----------
  const b2 = document.getElementById('mode-2d'), b3 = document.getElementById('mode-3d');
  function setStyle(three) {
    is3D = three;
    b3.setAttribute('aria-pressed', String(three));
    b2.setAttribute('aria-pressed', String(!three));
    try { localStorage.setItem('sleepsheeps.style', three ? '3d' : '2d'); } catch (e) {}
    if (scene3) scene3.show(three);
  }
  const scene3 = three;
  b2.addEventListener('click', () => setStyle(false));
  b3.addEventListener('click', () => { if (scene3) scene3.askMotion(); setStyle(true); });
  setStyle(is3D);

  // ---------- double-tap the moon to reset ----------
  let lastTap = 0, toastTimer = 0;
  const toast = document.getElementById('toast');
  function onTap(e) {
    const dx = e.clientX - moonGeom.cx, dy = e.clientY - moonGeom.cy;
    if (Math.hypot(dx, dy) > moonGeom.R * 1.15) { lastTap = 0; return; }
    const now = performance.now();
    if (now - lastTap < 400) {
      lastTap = 0;
      count = 0;
      resetFlash = 1;
      saveCount();
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
    } else {
      lastTap = now;
    }
  }
  cv.addEventListener('pointerup', onTap);
  if (scene3) scene3.el.addEventListener('pointerup', onTap);
  cv.addEventListener('dblclick', (e) => e.preventDefault());

  // ---------- exit ----------
  const gn = document.getElementById('goodnight');
  document.getElementById('exit').addEventListener('click', () => {
    // Inside the Android app, ask the app itself to close.
    try { if (window.SheepApp && window.SheepApp.exit) { window.SheepApp.exit(); return; } } catch (e) {}
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {}
    try { window.close(); } catch (e) {}
    // If the browser refuses to close the window, fade to a resting screen instead.
    setTimeout(() => {
      if (window.closed) return;
      running = false;
      try { wakeLock && wakeLock.release(); } catch (e) {}
      document.getElementById('gn-count').textContent =
        count === 1 ? 'You counted 1 sheep. Sweet dreams.' : `You counted ${count} sheep. Sweet dreams.`;
      gn.hidden = false;
      requestAnimationFrame(() => gn.classList.add('show'));
    }, 250);
  });
  document.getElementById('wake').addEventListener('click', () => {
    gn.classList.remove('show');
    setTimeout(() => { gn.hidden = true; }, 800);
    last = performance.now();
    running = true;
    keepAwake();
  });
})();
</script>

</body></html>
